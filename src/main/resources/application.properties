
spring.application.name=app-validate-excel

# Cấu hình giới hạn kích thước file tải lên (khắc phục lỗi 413 Content Too Large)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Bind chặt vào 127.0.0.1 (an toàn bảo mật mạng)
server.address=127.0.0.1
server.port=8080

# Cấu hình bộ đệm máy chủ web Tomcat
server.tomcat.max-http-form-post-size=100MB
server.tomcat.max-swallow-size=-1

# Cấu hình thư mục lưu trữ BQP SQLite
bqp.storage.base-dir=${BQP_DATA_DIR:}

# Launcher kiểm soát việc mở trình duyệt qua URL bootstrap; Java không tự mở nữa.
# Đặt true chỉ để phát triển cục bộ (không qua launcher).
app.auto-open-browser=false
